<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Carimbo FUST</title>

<style>
    /* Tema Claro */

body{
    background:#f5f5f5;
    color:#333;
}

.container{
    background:white;
}

/* Tema Escuro */

body.dark{
    background:#1e1e1e;
    color:white;
}
body.dark .container{
    background:#2b2b2b;
}

body.dark input,
body.dark textarea{
    background:#3a3a3a;
    color:white;
    border:1px solid #555;
}

body.dark label{
    color:white;
}

body.dark .readonly{
    background:#444;
}

body.dark #textoPortal{
    background:#3a3a3a;
    color:white;
}

body.dark .btn-voltar,
body.dark button{
    background:#7e1ac7;
}
body.dark .header{
    background:#660099;
    color:white;
}

body.dark .tab:not(.active){
    background:#444;
    color:white;
}

body.dark .container{
    background:#2b2b2b;
}

body.dark textarea{
    background:#3a3a3a;
    color:white;
    border:1px solid #555;
}

body.dark select,
body.dark input{
    background:#3a3a3a;
    color:white;
    border:1px solid #555;
}

body { font-family: Arial, sans-serif; background:#f5f5f5; margin:0; }
.header { background:#660099; /* Roxo Vivo */; color:white; padding:15px; text-align:center; font-size:20px; font-weight:bold; margin-bottom:20px}

.tabs { display:flex; justify-content:center; gap:30px; margin-bottom:15px; }
.tabs button { width:300px; flex:none; }
.tab { flex:1; padding:10px; border:none; cursor:pointer; background:#ccc; font-weight:bold; }
.tab.active { background:#660099; color:white; }

.container { max-width:700px; margin:20px auto; background:white; padding:25px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.15); }

label { display:block; margin-top:12px; font-weight:600; color:#333; }
select, input { width:100%; padding:10px; margin-top:5px; border-radius:5px; border:1px solid #ccc; }

button { margin-top:15px; padding:12px; width:100%; border:none; border-radius:5px; font-weight:bold; cursor:pointer; }

.btn-gerar { background:#660099; /* Roxo Vivo */; color:white }
.btn-copiar { background:#0070C0; /* Azul institucional */; color:white }

textarea { width:100%; height:240px; margin-top:15px; border-radius:5px; border:1px solid #ccc; padding:10px; }

.topo{ padding:15px; }

.aba { display:none; }
.ativa { display:block; }
.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 20px;
}

.btn-voltar{
    background:#660099;
    color:white;
    text-decoration:none;
    padding:12px 18px;
    border-radius:8px;
    font-weight:bold;
    border:none;
    cursor:pointer;
    min-width:220px;
    text-align:center;
    font-size:16px;
    box-sizing:border-box;
}

.btn-tema{
    background:#660099;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;

    width:170px !important;
    min-width:170px;
    max-width:170px;

    height:48px;
    padding:0;
    margin:0;

    font-size:14px;
}
#temaBtn{
    width:170px !important;
    min-width:170px;
    max-width:170px;
    height:48px;
    margin:0;
    padding:0;
}
.btn-voltar:hover,
.btn-tema:hover{
    background:#7e1ac7;
}
.btn-topo{
    position:fixed;
    bottom:20px;
    left:20px;

    display:none;

    width:auto !important;
    min-width:120px;

    background:#660099;
    color:white;

    border:none;
    border-radius:8px;

    padding:12px 18px;

    cursor:pointer;
    font-weight:bold;

    z-index:1000;
}
.btn-topo:hover{
    background:#7e1ac7;
}
.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.5);
    justify-content:center;
    align-items:center;
    z-index:9999;
}
.modal-conteudo{
    background:white;
    padding:25px;
    border-radius:12px;
    width:400px;
    max-width:90%;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,.3);
}
.modal-conteudo h3{
    margin-top:0;
    color:#660099;
}
body.dark .modal-conteudo{
    background:#2b2b2b;
    color:white;
}
</style>
</head>

<body>

<div class="topo">

    <a href="#"
   class="btn-voltar"
   onclick="voltarPortal(); return false;">
        🏠 Voltar ao Portal
    </a>

    <button id="temaBtn"
            class="btn-tema"
            onclick="alternarTema()">
        🌙 Modo Escuro
    </button>

</div>

<div class="header">
    Gerador de Carimbo FUST
    
</div>
    
<div class="tabs">
  <button class="tab active" onclick="trocarAba('aba1', this)">Carimbo TASK</button>
  <button class="tab" onclick="trocarAba('aba2', this)">Carimbo Incidente</button>
</div>

<!-- ABA 1 -->
<div id="aba1" class="container aba ativa">

<label>Pendência</label>
<select id="pendencia">
<option>AP</option>
<option>FW</option>
<option>SW</option>
<option>SIMETBOX</option>
<option>LINK DOWN</option>
<option>INFRA</option>
<option>TROCA</option>
</select>

<label>Status</label>
<select id="status">
<option>CONCLUIDO</option>
<option>CLIENTE_IMPRODUTIVA</option>
<option>NÃO RESOLUTIVO</option>
<option>DUPLICADO/INDEVIDO</option>
</select>

<label>Parceira</label>
<select id="parceira">
<option>DELFIA</option>
<option>INELCOM</option>
<option>MAMINFO</option>
<option>SPREAD</option>
</select>

<label>Motivo</label>
<select id="motivo">
<option>CABEAMENTO DESCONECTADO</option>
<option>CONFIGURAÇÕES</option>
<option>DESISTENCIA PROJETO FUST</option>
<option>ENDEREÇO INCORRETO</option>
<option>ENERGIA ELÉTRICA</option>
<option>EQUIPAMENTOS DESLIGADOS</option>
<option>EQUIPAMENTO TRAVADO</option>
<option>ESCOLA EM REFORMA</option>
<option>ESCOLA FECHADA</option>
<option>ESCOLA FECHOU - DEPOIS DAS 16H</option>
<option>ESTABILIZADOR/NO BREAK</option>
<option>FALTA DE ENERGIA</option>
<option>FALTA DE MATERIAIS</option>
<option>FILTRO DE LINHA</option>
<option>FURTO/ROUBO</option>
<option>FUSÃO DE FIBRA</option>
<option>DUPLICADO/INDEVIDO</option>
<option>INFRA</option>
<option>INFRA_CLIENTE</option>
<option>LIBERAÇÃO NÃO AUTORIZADA</option>
<option>LINK DOWN</option>
<option>MASSIVA</option>
<option>MUDANÇA ENDEREÇO</option>
<option>NÃO VALIDADO</option>
<option>NORMALIZADO SEM INTERVENÇÃO</option>
<option>REBOOT</option>
<option>REDE EXTERNA</option>
<option>REMANEJAMENTO</option>
<option>RESET</option>
<option>RESPONSÁVEL AUSENTE</option>
<option>RETIRADA DE EQUIPAMENTOS</option>
<option>RETIRADA DE EQUIPAMENTOS - RMA</option>  
<option>TOPOLOGIA</option>
<option>TOPOLOGIA INCORRETA</option>
<option>TROCA</option>
<option>TROCA DE CABEAMENTO</option>
<option>TROCA DE CONECTOR (RJ-45)</option>
<option>TROCA DE POWER INJECTOR</option>
<option>TROCA DO EQUIPAMENTO</option>
<option>TROCA POE</option>
</select>

<label>Técnico</label>
<input id="tecnico" placeholder="Nome do Técnico">

<button class="btn-gerar" onclick="gerarCarimbo()">Gerar Carimbo</button>
<button class="btn-copiar" onclick="copiar()">Copiar Carimbo</button>

<textarea id="resultado" readonly></textarea>

</div>

<!-- ABA 2 -->
<div id="aba2" class="container aba">

<label>Operadora</label>

<select id="operadora2"
        onchange="validarOperadora()">

    <option>VIVO</option>
    <option>PARCEIRA</option>

</select>

<div id="campoParceira">

    <label>Parceira</label>

    <select id="parceira2">

        <option>DELFIA</option>
        <option>INELCOM</option>
        <option>MAMINFO</option>
        <option>SPREAD</option>

    </select>

</div>
    
<label>Pendência</label>
<select id="pendencia2">
<option>AP</option>
<option>FW</option>
<option>SW</option>
<option>LINK</option>
<option>SIMETBOX</option>
</select>

<label>Motivo</label>
<select id="motivo2">
<option>DOWN</option>
<option>TROCA</option>
<option>REMANEJAMENTO</option>
<option>INFRA</option>
<option>CONFIGURAÇÃO</option>
<option>CABEAMENTO</option>
</select>

<label>Previsão para Reparo</label>
<input type="date" id="data2">

<button class="btn-gerar" onclick="gerarCarimbo2()">Gerar Carimbo</button>
<button class="btn-copiar" onclick="copiarCarimbo2()">Copiar Carimbo</button>

<textarea id="resultado2" readonly></textarea>

</div>

<script>

if(
    !sessionStorage.getItem(
        "usuarioLogado"
    )
){

    window.location.href =
        "login.html";

}
function trocarAba(id, el) {

  document.getElementById('aba1').classList.remove('ativa');
  document.getElementById('aba2').classList.remove('ativa');

  document.getElementById(id).classList.add('ativa');

  var tabs = document.getElementsByClassName('tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.remove('active');
  }

  el.classList.add('active');
}

/* CARIMBO 1 */
function gerarCarimbo(){

  const pendencia =
      document.getElementById('pendencia').value;

  const status =
      document.getElementById('status').value;

  const parceira =
      document.getElementById('parceira').value;

  const motivo =
      document.getElementById('motivo').value;

  const tecnico =
      document.getElementById('tecnico').value;

  const texto = `PENDÊNCIA: ${pendencia}
STATUS: ${status}
PARCEIRA: ${parceira}
MOTIVO: ${motivo}
TÉCNICO: ${tecnico}`;

  document.getElementById('resultado').value =
      texto;

}
function copiar(){

    const texto =
        document.getElementById(
            "resultado"
        ).value;

    navigator.clipboard
        .writeText(texto)
        .then(() => {

            mostrarAviso(
                "Carimbo copiado com sucesso!"
            );

        });

}
/* CARIMBO 2 */
function gerarCarimbo2(){
const operadora =
    document.getElementById(
        "operadora2"
    ).value;

const parceira =

    operadora === "VIVO"

    ? "N/A"

    : document.getElementById(
        "parceira2"
      ).value;
    const pendencia = document.getElementById('pendencia2').value;
  const motivo = document.getElementById('motivo2').value;
  const data = document.getElementById('data2').value || "SEM PREVISÃO";

const texto =

operadora === "VIVO"

? `OPERADORA: ${operadora}
PENDÊNCIA: ${pendencia}
MOTIVO: ${motivo}
PREVISÃO: ${data}`

: `OPERADORA: ${operadora}
PARCEIRA: ${parceira}
PENDÊNCIA: ${pendencia}
MOTIVO: ${motivo}
PREVISÃO: ${data}`;
  document.getElementById('resultado2').value = texto;
}
function validarOperadora(){

    const operadora =
        document.getElementById(
            "operadora2"
        ).value;

    const campoParceira =
        document.getElementById(
            "campoParceira"
        );

    if(operadora === "VIVO"){

        campoParceira.style.display =
            "none";

        document.getElementById(
            "parceira2"
        ).selectedIndex = 0;

    }else{

        campoParceira.style.display =
            "block";

    }

}
function copiarCarimbo2(){

    const texto =
        document.getElementById(
            "resultado2"
        ).value;

    navigator.clipboard
        .writeText(texto)
        .then(() => {

            mostrarAviso(
                "Carimbo copiado com sucesso!"
            );

        });

}
function voltarPortal(){

    window.location.replace(
        "index.html?v=" +
        Date.now()
    );

}
function alternarTema(){

    document.body.classList.toggle("dark");

    const escuro =
        document.body.classList.contains("dark");

    localStorage.setItem(
        "tema",
        escuro ? "dark" : "light"
    );

    document.getElementById("temaBtn").innerHTML =
        escuro
        ? "☀️ Modo Claro"
        : "🌙 Modo Escuro";

}

window.addEventListener("load", () => {

    validarOperadora();
    
    const tema =
        localStorage.getItem("tema");

    if(tema === "dark"){

        document.body.classList.add("dark");

        document.getElementById("temaBtn")
            .innerHTML =
            "☀️ Modo Claro";

    }

});
function voltarTopo(){

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

window.addEventListener("scroll", () => {

    const btn =
        document.getElementById("btnTopo");

    if(window.scrollY > 300){

        btn.style.display = "block";

    }else{

        btn.style.display = "none";

    }

});
function mostrarAviso(texto){

    document.getElementById(
        "textoModal"
    ).innerHTML = texto;

    document.getElementById(
        "modalAviso"
    ).style.display = "flex";

}

function fecharModal(){

    document.getElementById(
        "modalAviso"
    ).style.display = "none";

}
</script>
<button
    id="btnTopo"
    class="btn-topo"
    onclick="voltarTopo()">

    ⬆ Topo

</button>
<div id="modalAviso" class="modal">

    <div class="modal-conteudo">

        <h3>Portal FUST</h3>

        <p id="textoModal"></p>

        <button onclick="fecharModal()">
            OK
        </button>

    </div>

</div>
</body>
</html>
