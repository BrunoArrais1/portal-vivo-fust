<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Busca Contatos FUST</title>

<style>
/* Tema Claro */

body{
    background:#f5f5f5;
    color:#333;
    font-family:Arial, sans-serif;
    margin:0;
}

.container{
    background:white;
}

/* Tema Escuro */

.dark{
    background:#1e1e1e;
    color:white;
}

.dark .container{
    background:transparent;
}
.dark .resultado {
    background: #3a3a3a;
    color: white;
}
.dark h3 {
    color: #b56cff;
}
.dark select,
.dark input {
    background: #3a3a3a;
    color: white;
    border: 1px solid #555
}
.dark .tabs button:not(.active) {
    background: #444;
    color: white;
}
.dark .box {
    background: #2b2b2b;
    color: white;
}
.dark input,
.dark textarea{
    background:#3a3a3a;
    color:white;
    border:1px solid #555;
}

.dark label{
    color:white;
}

.dark .readonly{
    background:#444;
}

.dark #textoPortal{
    background:#3a3a3a;
    color:white;
}

.dark .btn-voltar,
.dark button{
    background:#7e1ac7;
}
body.dark .box{
    background:#2b2b2b;
    color:white;
}
.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 20px;
}

.btn-voltar{
    background:#660099;
    color:white;
    text-decoration:none;
    padding:12px 18px;
    border-radius:8px;
    font-weight:bold;
    border:none;
    cursor:pointer;
    min-width:220px;
    text-align:center;
    font-size:16px;
    box-sizing:border-box;
}

.btn-voltar:hover{
    background:#7e1ac7;
}

.header{
    background:#660099;
    color:white;
    padding:15px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
}

.container{
    max-width:1000px;
    margin:30px auto;
}

.box{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:25px;
}

.tabs button{
    flex:1;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.tabs button.active{
    background:#660099;
    color:white;
}

.tabs button:not(.active){
    background:#ddd;
    color:black;
}

h3{
    color:#660099;
    text-align:center;
}

select,
input{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing:border-box;
    margin-top:10px;
}

.campo-inep{
    width:500px;
    max-width:100%;
    margin:auto;
    display:block;
}

.btn-busca{
    width:220px;
    margin:15px auto;
    display:block;
    background:#660099;
    color:white;
    border:none;
    border-radius:8px;
    padding:12px;
    cursor:pointer;
    font-weight:bold;
}

.btn-busca:hover{
    background:#7e1ac7;
}

.resultado{
    margin-top:20px;
    background:#f0e6ff;
    padding:20px;
    border-radius:10px;
    line-height:1.8;
}

#abaINEP{
    text-align:center;
}

.campo-municipio{
    width:500px;
    max-width:100%;
    margin:auto;
    display:block;
    text-align:center;
}
.btn-tema{
    background:#660099;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;

    width:170px !important;
    min-width:170px;
    max-width:170px;

    height:48px;
    padding:0;
    margin:0;

    font-size:14px;
}

#temaBtn{
    width:170px !important;
    min-width:170px;
    max-width:170px;
    height:48px;
    margin:0;
    padding:0;
}

#temaBtn:hover{
    background:#7e1ac7;
}    
</style>
</head>

<body>

<div class="topo">

    <a href="#"
   class="btn-voltar"
   onclick="voltarPortal(); return false;">
        🏠 Voltar ao Portal
    </a>

    <button id="temaBtn"
            class="btn-tema"
            onclick="alternarTema()">
        🌙 Modo Escuro
    </button>

</div>

<div class="header">
    Busca de Contatos FUST
</div>
    
<div class="container">

<div class="box">

    <div class="tabs">

        <button id="btnInep"
                class="active"
                onclick="mostrarAba('inep')">

            INEP

        </button>

        <button id="btnMun"
                onclick="mostrarAba('mun')">

            Município

        </button>

    </div>

    <!-- MUNICÍPIO -->

    <div id="abaMunicipio"
         style="display:none;">
        
        <h3>Buscar por Município</h3>

        <select id="municipio" class="campo-municipio">
            <option>Carregando municípios...</option>
        </select>

        <button class="btn-busca"
                onclick="buscarMunicipio()">

            Buscar

        </button>

        <div id="resMun"
             class="resultado">

        </div>

    </div>

    <!-- INEP -->

    <div id="abaINEP">

        <h3>Consulta por INEP</h3>

        <input
            id="inep"
            class="campo-inep"
            placeholder="Digite o código INEP">
        
        <button class="btn-busca"
                onclick="buscarINEP()">

            Buscar

        </button>

        <div id="resINEP"
             class="resultado">

        </div>

    </div>

</div>

</div>

<script>

if(
    !localStorage.getItem(
        "usuarioLogado"
    )
){

    window.location.href =
        "login.html";

}

let baseMunicipio = [];
let baseINEP = [];

document.addEventListener("DOMContentLoaded", async () => {

    try {

        const municipios =
            await fetch("./municipios.json");

        baseMunicipio =
            await municipios.json();

        const inep =
            await fetch("./inep.json");

        baseINEP =
            await inep.json();

        carregarMunicipios();

    }
    catch(error){

        console.error(error);

        alert("Erro ao carregar as bases JSON.");

    }

});

function mostrarAba(tipo){

    document.getElementById("abaMunicipio")
        .style.display =
        tipo === "mun" ? "block" : "none";

    document.getElementById("abaINEP")
        .style.display =
        tipo === "inep" ? "block" : "none";

    document.getElementById("btnMun")
        .classList.toggle("active",
        tipo === "mun");

    document.getElementById("btnInep")
        .classList.toggle("active",
        tipo === "inep");

}

function carregarMunicipios(){

    const select =
        document.getElementById("municipio");

    select.innerHTML =
        '<option value="">Selecione um município</option>';

    const municipios =
        [...new Set(
            baseMunicipio.map(
                x => x["MUNICIPIO"]
            )
        )].sort();

    municipios.forEach(municipio => {

        const option =
            document.createElement("option");

        option.value =
            municipio;

        option.textContent =
            municipio;

        select.appendChild(option);

    });

}

function buscarMunicipio(){

    const municipio =
        document.getElementById("municipio").value;

    const registro =
        baseMunicipio.find(
            x => x["MUNICIPIO"] === municipio
        );

    const resultado =
        document.getElementById("resMun");

    if(!registro){

        resultado.innerHTML =
            "Município não localizado.";

        return;
    }

    resultado.innerHTML = `
        <b>Secretário:</b> ${registro["SECRETARIO"]}<br>
        <b>Email:</b> ${registro["E-MAIL"]}
    `;

}

function buscarINEP(){

    const inep =
        document.getElementById("inep")
        .value
        .trim();

    if(!inep){

        alert(
            "Favor informar INEP."
        );

        document.getElementById("inep")
            .focus();

        return;
    }

    const registro =
        baseINEP.find(
            x => String(x["INEP"]) === String(inep)
        );

    const resultado =
        document.getElementById("resINEP");

    if(!registro){

        resultado.innerHTML =
            "INEP não localizado.";

        return;
    }

    resultado.innerHTML = `
        <b>Nome da Escola:</b> ${registro["NOME ESCOLA"]}<br>
        <b>Responsável:</b> ${registro["NOME RESPONSÁVEL"]}<br>
        <b>Email:</b> ${registro["EMAIL INSTITUICAO"]}<br>
        <b>Telefone:</b> ${registro["TELEFONE INSTITUIÇÃO"]}
    `;

}
function voltarPortal(){

    window.location.replace(
        "index.html?v=" +
        Date.now()
    );

}
function alternarTema(){

    document.body.classList.toggle("dark");

    const escuro =
        document.body.classList.contains("dark");

    localStorage.setItem(
        "tema",
        escuro ? "dark" : "light"
    );

    document.getElementById("temaBtn").innerHTML =
        escuro
        ? "☀️ Modo Claro"
        : "🌙 Modo Escuro";

}

window.addEventListener("load", () => {

    const tema =
        localStorage.getItem("tema");

    if(tema === "dark"){

        document.body.classList.add("dark");

        document.getElementById("temaBtn")
            .innerHTML =
            "☀️ Modo Claro";

    }

    document.getElementById("inep")
    .addEventListener("keydown", function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            buscarINEP();

        }

    });
        document.getElementById("inep").focus();

});

</script>

</body>
</html>
