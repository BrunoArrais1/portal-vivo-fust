<div class="topo">

    <a href="#"
   class="btn-voltar"

<div class="header">
    Solicitação de Manutenção FUST

</div>    
<div class="container">
        
<div class="busca-inep">

    <label>INEP</label>

    <div class="linha-inep">

        <input id="inep" type="text">

            Limpar

        </button>

</div>

<label>Parceira</label>
<input id="parceira" class="readonly" readonly>
<label>Escola</label>
<input id="escola" class="readonly" readonly>

<label>ID Vivo</label>
<input id="idvivo" class="readonly" readonly>

<label>Chamado Vivo <span style="color:red">*</span></label>
<input id="chamado">

<label>Falhas Comuns</label>

<div class="falhas">

<button type="button" onclick="definirFalha('AP-XX Down, favor verificar infra e se houver portas com led laranja, favor corrigir cabos ou conectores.')">AP DOWN</button>

<button type="button" onclick="definirFalha('Devido histórico de quedas recorrentes do AP-XX, é necessário verificar a infra do equipamento, e a possibilidade de troca de cabeamento ou conectores.')">AP INFRA</button>

<button type="button" onclick="definirFalha('Necessário trocar/substituir o AP-XX que mesmo após procedimentos padrões, equipamento não responde/não aceita reset e permanece travado.')">AP TROCA</button>

<button type="button" onclick="definirFalha('Simetbox sem gerencia, favor verificar se equipamento está ligado e conectado ao FW e corrigir possíveis falhas.')">SIMETBOX DOWN</button>

<button type="button" onclick="definirFalha('Necessário trocar/substituir o Simetbox que mesmo após procedimentos padrões, equipamento não responde/não aceita reset e permanece travado.')">SIMETBOX TROCA</button>

<button type="button" onclick="definirFalha('FW Down, favor verificar infra, bem como se o equipamento está ligado/conectado.')">FW DOWN</button>

<button type="button" onclick="definirFalha('Necessário trocar/substituir o FW que mesmo após procedimentos padrões, equipamento não responde/não aceita reset e permanece travado.')">FW TROCA</button>

<button type="button" onclick="definirFalha('SW Down, favor verificar infra e se houver portas com led laranja, favor corrigir cabos ou conectores.')">SW DOWN</button>

<button type="button" onclick="definirFalha('Necessário trocar/substituir o SW que mesmo após procedimentos padrões, equipamento não responde/não aceita reset e permanece travado.')">SW TROCA</button>

<button type="button" onclick="definirFalha('Equipamentos estão desconectados em nossa gerência, favor verificar se estão ligados corretamente, bem como a infra do local (cabos e conectores).')">EQUIPAMENTOS FORA</button>

<button type="button" onclick="definirFalha('Necessário remanejar equipamentos:')">REMANEJAMENTO</button>

<button type="button" onclick="definirFalha('Necessário verificar/corrigir a infra no local:')">INFRA</button>

<div class="area-final">

<div class="acoes">

                type="button"

        <div class="obs-botao">
            (clicar antes de Abrir Portal)
        </div>

        <button class="btn-gerar"
                type="button"

            📋 Gerar Texto

        </button>

    </div>

    <div class="grupo-acao">

        <div class="obs-botao">
            (primeiro Gerar Texto)
        </div>

        <button class="btn-gerar"
                type="button"
                onclick="abrirPortal()">

            🌐 Abrir Portal

        </button>

    </div>

</div>    
<script>

if(
    !sessionStorage.getItem(
        "usuarioLogado"
    )
){

    window.location.href =
        "login.html";

}
async function buscarINEP(){

    const inep = document
        .getElementById("inep")
        .value
        .trim();

    if(!inep){

    mostrarAviso(
    "Favor informar o INEP."
);
        document.getElementById("inep").focus();
        
        return;
    }

    try{

        const resposta =
            await fetch("./dados.json");

        const dados =
            await resposta.json();

        console.log(dados);

        const registro =
            dados.find(item =>
                String(item.INEP) === String(inep)
            );

        if(!registro){

mostrarAviso(
    "INEP não encontrado."
);
        return;
            
        }

        document.getElementById("parceira").value =
            registro.PARCEIRA;
        
const campoParceira =
    document.getElementById("parceira");

if(
    registro.PARCEIRA &&
    registro.PARCEIRA.trim().toUpperCase() === "PENDENTE"
){

    campoParceira.style.color = "#FF0000";
    campoParceira.style.fontWeight = "bold";
    campoParceira.style.backgroundColor = "#FFE5E5";

}else{

    campoParceira.style.color = "";
    campoParceira.style.fontWeight = "";
    campoParceira.style.backgroundColor = "";

}
        document.getElementById("escola").value =
            registro.ESCOLA;

        document.getElementById("idvivo").value =
            registro.ID_VIVO;

    }

    catch(erro){

        console.error(erro);

        mostrarAviso(
    "Erro ao ler o arquivo dados.json."
);

    }

}
function voltarPortal(){

    window.location.replace(
        "index.html?v=" +
        Date.now()
    );

}
function validarChamado(){

    const chamado =
        document.getElementById("chamado").value.trim();

    if(!chamado){

        mostrarAviso(
    "Preencha o campo Chamado Vivo."
);

        document.getElementById("chamado").focus();

        return false;
    }

    return true;
}

function definirFalha(texto){

    document.getElementById("falha").value =
        texto;

}

function gerarEmail(){

    if(!validarChamado()){
        return;
    }

    const parceira =
        document.getElementById("parceira").value;

    if(
        parceira &&
        parceira.trim().toUpperCase() === "PENDENTE"
    ){

mostrarAviso(
    "INEP não localizado.<br>Confirmar implantação no Diário de Bordo."
);

        return;
    }

    const portais = {

        "DELFIA":
            "https://delfia.atlassian.net/servicedesk/customer/portal/2117/group/2453/create/3574",

        "MAMINFO":
        "https://mamerp.maminfo.com.br/chamados/abertura-chamados"

};

    const escola =
        document.getElementById("escola").value;

    const id =
        document.getElementById("idvivo").value;

    const inep =
        document.getElementById("inep").value;

    const chamado =
        document.getElementById("chamado").value;

    const falha =
        document.getElementById("falha").value;

    const destinatarios = {

        "DELFIA":
            "heitor.rodrigues@delfia.tech",

        "SPREAD":
            "operacaovivofust@spread.com.br;gabriel.qsantos@spread.com.br;marques.cruz@spread.com.br",

        "INELCOM":
            "sustentacao_fust@inelcom.com.br;jceballos@inelcom.es;leopoldo.rodrigues@inelcom.com.br",

        "MAMINFO":
            "atendimento@maminfo.com.br",

    };

    const emailDestino =
        destinatarios[
            parceira.toUpperCase()
        ] || "";

    const assunto =
`MANUTENÇÃO - ${parceira} - INEP ${inep} - ${escola} - ID ${id} - CHAMADO ${chamado}`;

    const corpo =
`Prezados,

Pedimos por gentileza que enviem um Field para verificar os equipamentos da unidade abaixo:

ID VIVO: ${id}
INEP: ${inep}
ESCOLA: ${escola}
CHAMADO VIVO: ${chamado}

Descrição da falha: ${falha}.

Favor orientar o técnico a informar o número do chamado Vivo.

Atenção!

Material necessário:
- Notebook - Com sistema operacional Windows 10 ou superior;
- Software Putty ou similar - para acesso à linha de comando;
- Cabo de rede sobressalente, caso precise refazer infra;
- Alicate de crimpar RJ45;
- Testador de cabo.

Validações:
- Entrar em contato com o NOC FUST no telefone (11) 3043-1333
- Durante toda a tratativa, manter contato com o NOC para validação das ações.

IMPORTANTE:
- O técnico deverá deixar o local somente após a validação ou confirmação do NOC FUST.
- Havendo problemas com a liberação de acesso, favor entrar em contato.`;
    
if (
    parceira.toUpperCase() === "DELFIA" ||
    parceira.toUpperCase() === "MAMINFO"
){

mostrarAviso(
    "Esta parceira utiliza Portal.<br>Utilize o botão 🌐 Abrir Portal."
);

    return;

}
    
const copia =
    "noc_fust.br@telefonica.com";

const link =
`mailto:${emailDestino}?cc=${encodeURIComponent(copia)}&subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;

mostrarConfirmacao(

    "⚠️ Antes de enviar o e-mail, lembre-se de alterar para a caixa do NOC FUST e adicionar a sua assinatura no final do corpo do e-mail.<br><br>Clique em Continuar para prosseguir.",

    function(confirmado){

        if(confirmado){

            window.location.href = link;

        }

    }

);

}
function abrirPortal(){

    const parceira =
        document
        .getElementById("parceira")
        .value
        .toUpperCase();

    const portais = {

        "DELFIA":
        "https://delfia.atlassian.net/servicedesk/customer/portal/2117/group/2453/create/3574",

        "MAMINFO":
        "https://mamerp.maminfo.com.br/chamados/abertura-chamados"

    };

    if(portais[parceira]){

        window.open(
            portais[parceira],
            "_blank"
        );

    }else{

mostrarAviso(
    "Esta parceira NÃO utiliza Portal.<br>Utilize o botão 📧 Gerar E-mail."
);

    }

}
function gerarTexto(){

    if(!validarChamado()){
        return;
    }

    const parceiro =
        document.getElementById("parceira").value;

    const escola =
        document.getElementById("escola").value;
    const id =
        document.getElementById("idvivo").value;

    const inep =
        document.getElementById("inep").value;

    const chamado =
        document.getElementById("chamado").value;

    const falha =
        document.getElementById("falha").value;

const assunto =
`MANUTENÇÃO - ${parceiro} - INEP ${inep} - ${escola} - ID ${id} - CHAMADO ${chamado}`;

const texto = `Prezados,

Pedimos por gentileza que enviem um Field para verificar os equipamentos da unidade abaixo:

ID VIVO: ${id}
INEP: ${inep}
ESCOLA: ${escola}
CHAMADO VIVO: ${chamado}

Descrição da falha:

${falha}

Favor orientar o técnico a informar o número do chamado Vivo.

Atenção!

Material necessário:
- Notebook com Windows 10 ou superior;
- Software Putty ou similar;
- Cabo de rede sobressalente;
- Alicate de crimpar RJ45;
- Testador de cabo.

Validações:
- Entrar em contato com o NOC FUST no telefone (11) 3043-1333.
- Manter contato com o NOC durante toda a tratativa.

IMPORTANTE:
- O técnico deverá deixar o local somente após validação do NOC FUST.
`;

    document.getElementById("resumoManutencao").value =
assunto;

    document.getElementById("textoPortal").value =
texto;
    
navigator.clipboard
    .writeText(texto)
    .then(() => {

        mostrarAviso(
            "Texto copiado para a área de transferência."
        );

    });
}
 function alternarTema(){

    document.body.classList.toggle("dark");

    const escuro =
        document.body.classList.contains("dark");

    localStorage.setItem(
        "tema",
        escuro ? "dark" : "light"
    );

    document.getElementById("temaBtn").innerHTML =
        escuro
        ? "☀️ Modo Claro"
        : "🌙 Modo Escuro";

}

window.addEventListener("load", () => {

    const tema =
        localStorage.getItem("tema");

    if(tema === "dark"){

        document.body.classList.add("dark");

        document.getElementById("temaBtn")
            .innerHTML =
            "☀️ Modo Claro";

    }
document.getElementById("inep")
.addEventListener("keydown", function(event){

    if(event.key === "Enter"){

        event.preventDefault();

        buscarINEP();

    }

    });
});
function limparFormulario(){

    mostrarConfirmacao(

        "Deseja realmente limpar todos os campos da solicitação?",

        function(confirmado){

            if(!confirmado){
                return;
            }

            document.getElementById("inep").value = "";
            document.getElementById("parceira").value = "";
            document.getElementById("escola").value = "";
            document.getElementById("idvivo").value = "";
            document.getElementById("chamado").value = "";

            document.getElementById("falha").value = "";
            document.getElementById("resumoManutencao").value = "";
            document.getElementById("textoPortal").value = "";

            const campoParceira =
                document.getElementById("parceira");

            campoParceira.style.color = "";
            campoParceira.style.fontWeight = "";
            campoParceira.style.backgroundColor = "";

            document.getElementById("inep").focus();

            mostrarAviso(
                "Formulário limpo com sucesso."
            );

        }

    );

}function voltarTopo(){

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

window.addEventListener("scroll", () => {

    const btn =
        document.getElementById("btnTopo");

    if(window.scrollY > 300){

        btn.style.display = "block";

    }else{

        btn.style.display = "none";

    }

});
function mostrarAviso(texto){

    document.getElementById(
        "textoModal"
    ).innerHTML = texto;

    document.getElementById(
        "modalAviso"
    ).style.display = "flex";

}

function fecharModal(){

    document.getElementById(
        "modalAviso"
    ).style.display = "none";

}
let callbackConfirmacao = null;

function mostrarConfirmacao(texto, callback){

    document.getElementById(
        "textoConfirmacao"
    ).innerHTML = texto;

    callbackConfirmacao = callback;

    document.getElementById(
        "modalConfirmacao"
    ).style.display = "flex";

}

function fecharConfirmacao(resultado){

    document.getElementById(
        "modalConfirmacao"
    ).style.display = "none";

    if(
        callbackConfirmacao
    ){

        callbackConfirmacao(
            resultado
        );

    }

}
function copiarResumo(){

    const texto =
        document.getElementById(
            "resumoManutencao"
        ).value;

    if(!texto){

        mostrarAviso(
            "Gere o texto primeiro."
        );

        return;

    }

    navigator.clipboard.writeText(
        texto
    );

    mostrarAviso(
        "Resumo copiado."
    );

}

function copiarPortal(){

    const texto =
        document.getElementById(
            "textoPortal"
        ).value;

    if(!texto){

        mostrarAviso(
            "Gere o texto primeiro."
        );

        return;

    }

    navigator.clipboard
        .writeText(texto)
        .then(() => {

            mostrarAviso(
                "Texto Portal copiado."
            );

        });

}
</script>
<button
    id="btnTopo"
    class="btn-topo"
    onclick="voltarTopo()">

    ⬆ Topo

</button>
<div id="modalAviso" class="modal">

    <div class="modal-conteudo">

        <h3>Portal FUST</h3>

        <p id="textoModal"></p>

        <button onclick="fecharModal()">
            OK
        </button>

    </div>

</div>
<div id="modalConfirmacao" class="modal">

    <div class="modal-conteudo">

        <h3>Portal FUST</h3>

        <p id="textoConfirmacao"></p>

        <div class="acoes-modal">

            <button
                class="btn-cancelar"
                onclick="fecharConfirmacao(false)">

                Cancelar

            </button>

            <button
                class="btn-confirmar"
                onclick="fecharConfirmacao(true)">

                Continuar

            </button>

        </div>

    </div>

</div>
</body>

</html>
